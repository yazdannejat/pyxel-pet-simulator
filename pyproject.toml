[project]
name = "pyxel-pet-simulator"
version = "0.1.0"
description = "Python pixel pet simulator"
readme = "README.md"
authors = [
    { name = "yazdannejat", email = "yazdannejat@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyxel>=2.9.9",
]

[project.scripts]
pet-simulator = "pyxel_pet_simulator:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
